apiVersion: apps/v1
kind: Deployment

metadata:
  name: healthcare-deployment
  namespace: healthcare

spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthcare-app

  template:
    metadata:
      labels:
        app: healthcare-app

    spec:
      containers:
      - name: healthcare-container
        image: krushjagdale/myproject:latest

        ports:
        - containerPort: 8082
